server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Never let browsers keep an old Godot export after a new deployment.
    # The .pck contains the compiled GDScript, so a stale cached pack can
    # continue throwing parse errors even when main.gd has already been fixed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|wasm|pck)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(png|webp|jpg|jpeg|svg|css)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}