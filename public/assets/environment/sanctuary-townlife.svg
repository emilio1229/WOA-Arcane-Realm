<g>
 <path d="M360 720H390L384 748H366Z" fill="#8e594e" stroke="#d8a27b" stroke-width="2"/>
 <path d="M375 720Q350 694 356 684Q376 692 375 720M376 720Q384 687 402 688Q404 706 376 720" fill="#679a77"/>
 <circle cx="356" cy="684" r="5" fill="#e6c08b"/>
