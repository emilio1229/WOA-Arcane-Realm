<path d="M500 290 478 303V277Z" fill="#d49c75" stroke="#f0d6b2" stroke-width="2"/>
<path d="M1300 290 1322 303V277Z" fill="#83b9a1" stroke="#d5e8ca" stroke-width="2"/>
<g fill="none" stroke="#f1d8a6" stroke-width="2" opacity=".72"><path d="M488 290 478 290M1312 290 1322 290"/></g>
