<g transform="translate(900 1075)">
 <ellipse cy="56" rx="58" ry="15" fill="#0a141b" opacity=".38"/>
 <path d="M-35 46V-42M35 46V-42" stroke="#654631" stroke-width="9"/>
 <rect x="-55" y="-83" width="110" height="82" rx="8" fill="#684a3c" stroke="url(#brass)" stroke-width="5"/>
 <rect x="-43" y="-70" width="86" height="55" rx="3" fill="#d8c39c" stroke="#463345" stroke-width="3"/>
 <path d="M-30-54H26M-30-42H18M-30-30H7" stroke="#9c7152" stroke-width="4" stroke-linecap="round"/>
 <path d="M0-100 8-84H-8Z" fill="#f1d69b"/>
 <circle cy="-58" r="4" fill="#bd7b61"/>
</g>
<g transform="translate(520 420)">
 <path d="M0 42V-38" stroke="#76563f" stroke-width="9"/>
 <path d="M-3-34 92-52 92-19-3-3Z" fill="#8b684b" stroke="#e0b77d" stroke-width="4"/>
 <path d="M9-25 78-38" stroke="#f6d9a2" stroke-width="3"/>
 <path d="M3 4 76-10 76 22 3 36Z" fill="#567b6c" stroke="#d2c39b" stroke-width="3"/>
 <path d="M15 15 62 6" stroke="#f4dfb2" stroke-width="3"/>
</g>
