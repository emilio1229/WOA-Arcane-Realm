 <path d="M1455 720Q1430 694 1436 684Q1456 692 1455 720M1456 720Q1464 687 1482 688Q1484 706 1456 720" fill="#679a77"/>
 <circle cx="1436" cy="684" r="5" fill="#e6c08b"/>
</g>
<!-- Fine inlaid brass markers and paving flecks. -->
<g fill="#e8c88f" opacity=".44"><circle cx="620" cy="900" r="3"/><circle cx="1180" cy="900" r="3"/><circle cx="420" cy="580" r="2"/><circle cx="1380" cy="580" r="2"/><path d="m900 930 7 12-7 12-7-12Z"/></g>
</svg>