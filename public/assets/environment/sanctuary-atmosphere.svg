<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
<defs>
 <radialGradient id="moonwell"><stop stop-color="#bdeeff" stop-opacity=".28"/><stop offset=".55" stop-color="#9d79df" stop-opacity=".13"/><stop offset="1" stop-color="#9d79df" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#d7a5ff" stop-opacity=".52"/><stop offset="1" stop-color="#a86ce8" stop-opacity="0"/></radialGradient>
 <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e1ff"/><stop offset=".42" stop-color="#b58de8"/><stop offset="1" stop-color="#4a3978"/></linearGradient>
 <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#261d35"/><stop offset=".5" stop-color="#72506c"/><stop offset="1" stop-color="#241a32"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#9bc99e"/><stop offset=".55" stop-color="#477e70"/><stop offset="1" stop-color="#1e3c3d"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <g id="tree">
  <ellipse cy="15" rx="75" ry="25" fill="#07131c" opacity=".55"/>
  <path d="M-10 20Q-2-28 2-70L20-103 9-20 20 20Z" fill="url(#bark)"/>
  <path d="M0-42Q-72-42-82-102Q-76-160-28-151Q-10-204 37-177Q94-162 74-101Q55-49 0-42Z" fill="url(#leaf)" stroke="#b5e4c1" stroke-opacity=".35" stroke-width="4"/>
  <path d="M-45-105Q-22-145 5-121M12-126Q48-158 57-112M-25-76Q8-111 42-83" fill="none" stroke="#d7f2cb" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  <circle cx="-48" cy="-113" r="6" fill="#d9a5f4"/><circle cx="48" cy="-145" r="5" fill="#f0d69c"/><circle cx="60" cy="-87" r="5" fill="#a5e9e0"/>
 </g>
 <g id="crystal">
  <path d="M0-54 19-18 12 37 0 51-13 31-18-18Z" fill="url(#crystal)" stroke="#e8d8ff" stroke-width="2"/>
  <path d="M0-54 2 8 12 37M-18-18 2 8-13 31" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="2"/>
 </g>
 <g id="rune">
  <circle r="20" fill="#1b1730" fill-opacity=".6" stroke="#d7b3f2" stroke-opacity=".65" stroke-width="2"/>
  <path d="M0-12V12M-9-5 0-13 9-5M-8 7H8" fill="none" stroke="#f1d8ff" stroke-width="2.5" stroke-linecap="round"/>
 </g>
</defs>
<!-- Cool moonlit pools and warm lantern spill, deliberately subtle beneath actors. -->
<ellipse cx="900" cy="615" rx="430" ry="265" fill="url(#moonwell)"/>
<ellipse cx="900" cy="274" rx="230" ry="185" fill="url(#violet)" filter="url(#blur)"/>
<ellipse cx="370" cy="690" rx="150" ry="90" fill="#8bd9c4" opacity=".055" filter="url(#blur)"/>
<ellipse cx="1440" cy="720" rx="180" ry="100" fill="#c59af2" opacity=".06" filter="url(#blur)"/>
<!-- A ceremonial, engraved ring around the fountain plaza. -->
<ellipse cx="900" cy="620" rx="245" ry="126" fill="none" stroke="#d8c3ed" stroke-opacity=".16" stroke-width="3"/>
<ellipse cx="900" cy="620" rx="226" ry="113" fill="none" stroke="#e5d2f5" stroke-opacity=".13" stroke-width="1.5" stroke-dasharray="3 13"/>
<path d="M900 476V500M900 740V764M650 620H676M1124 620H1150" stroke="#f1d49e" stroke-opacity=".38" stroke-width="4" stroke-linecap="round"/>
<path d="M775 526Q900 465 1025 526M775 714Q900 775 1025 714" fill="none" stroke="#c7a6e9" stroke-opacity=".22" stroke-width="3"/>
<use href="#rune" transform="translate(900 492) scale(.7)"/><use href="#rune" transform="translate(900 748) scale(.7)"/>
<use href="#rune" transform="translate(680 620) scale(.65)"/><use href="#rune" transform="translate(1120 620) scale(.65)"/>
<!-- Dense framing groves at the outer corners, clear of the main paths. -->
<use href="#tree" transform="translate(105 190) scale(1.12)"/><use href="#tree" transform="translate(290 160) scale(.82)"/>
<use href="#tree" transform="translate(1690 175) scale(1.12)"/><use href="#tree" transform="translate(1770 410) scale(.76)"/>
<use href="#tree" transform="translate(100 1000) scale(.94)"/><use href="#tree" transform="translate(275 1140) scale(1.08)"/>
<use href="#tree" transform="translate(1580 1130) scale(1.06)"/><use href="#tree" transform="translate(1740 940) scale(.92)"/>
<!-- Crystal beds and low stone planters. -->
<g opacity=".92">
 <ellipse cx="245" cy="390" rx="90" ry="30" fill="#152d31" stroke="#7da99a" stroke-opacity=".3" stroke-width="3"/>
 <ellipse cx="245" cy="382" rx="76" ry="22" fill="#315d4d"/>
 <use href="#crystal" transform="translate(218 350) scale(.7)"/><use href="#crystal" transform="translate(249 342) scale(1.02)"/><use href="#crystal" transform="translate(278 356) scale(.62)"/>
 <ellipse cx="1550" cy="385" rx="92" ry="31" fill="#152d31" stroke="#7da99a" stroke-opacity=".3" stroke-width="3"/>
 <ellipse cx="1550" cy="377" rx="78" ry="23" fill="#315d4d"/>
 <use href="#crystal" transform="translate(1522 345) scale(.68)"/><use href="#crystal" transform="translate(1553 336) scale(1.05)"/><use href="#crystal" transform="translate(1583 350) scale(.6)"/>
 <ellipse cx="285" cy="890" rx="80" ry="27" fill="#172f30" stroke="#7da99a" stroke-opacity=".25" stroke-width="3"/>
 <use href="#crystal" transform="translate(260 854) scale(.58)"/><use href="#crystal" transform="translate(290 846) scale(.84)"/><use href="#crystal" transform="translate(314 861) scale(.54)"/>
 <ellipse cx="1515" cy="890" rx="80" ry="27" fill="#172f30" stroke="#7da99a" stroke-opacity=".25" stroke-width="3"/>
 <use href="#crystal" transform="translate(1490 854) scale(.58)"/><use href="#crystal" transform="translate(1520 846) scale(.84)"/><use href="#crystal" transform="translate(1544 861) scale(.54)"/>
</g>
<!-- Scattered tiny rune markers guide exploration without cluttering the walkable plaza. -->
<g fill="#f0d49b" opacity=".52">
 <path d="m520 420 5 10-5 10-5-10Z"/><path d="m1280 420 5 10-5 10-5-10Z"/>
 <path d="m520 820 5 10-5 10-5-10Z"/><path d="m1280 820 5 10-5 10-5-10Z"/>
</g>
<g fill="#d8b5f2" opacity=".55">
 <circle cx="565" cy="465" r="3"/><circle cx="1235" cy="465" r="3"/><circle cx="565" cy="775" r="3"/><circle cx="1235" cy="775" r="3"/>
 <circle cx="700" cy="910" r="2.5"/><circle cx="1100" cy="910" r="2.5"/><circle cx="700" cy="340" r="2.5"/><circle cx="1100" cy="340" r="2.5"/>
</g>
</svg>