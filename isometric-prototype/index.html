<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090714"><title>WoA — Isometric Town Prototype</title>
<style>
:root{color-scheme:dark;--violet:#a65bff;--pink:#f0a2ff;--gold:#e9cc8c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090714;color:#f7efff;font-family:Georgia,serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:fixed;z-index:2;inset:env(safe-area-inset-top) 0 auto 0;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none}.panel{background:linear-gradient(135deg,#160d28eF,#0b0918ed);border:1px solid #7951a8;border-radius:10px;padding:9px 12px;box-shadow:0 4px 20px #0008;max-width:65vw}.title{font-size:13px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}.small{font-size:12px;color:#d5c2e9;margin-top:3px}.pill{border:1px solid #69468a;border-radius:8px;padding:8px 10px;background:#160e28;color:#f5dfff;font:inherit;pointer-events:auto}.tools{display:flex;gap:6px;pointer-events:auto}.tools button{min-width:38px;min-height:38px;border:1px solid #a77bc6;border-radius:9px;background:#241439ee;color:white;font:inherit;font-size:18px;touch-action:manipulation}.tools .act{min-width:78px;background:linear-gradient(135deg,#6f35a1,#3b1e62);border-color:#e1a8ff;font-size:13px;font-weight:bold}.pad button{user-select:none;-webkit-user-select:none}.bottom{position:fixed;z-index:3;left:0;right:0;bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}.hint{max-width:48vw;font-size:12px;color:#e4d2f5;background:#100a1edb;border:1px solid #51366d;border-radius:8px;padding:8px 10px}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px;pointer-events:auto}.pad button{border:1px solid #a77bc6;border-radius:9px;background:#241439eF;color:white;font-size:18px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.toast{position:fixed;z-index:4;left:50%;top:24%;transform:translateX(-50%);padding:10px 14px;background:#160b27ed;border:1px solid #b36af0;border-radius:10px;text-align:center;max-width:85vw;display:none}.toast.show{display:block}@media(min-width:760px){.panel{padding:12px 16px}.title{font-size:15px}.small{font-size:13px}.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}.hint{font-size:13px;max-width:380px}}@media(orientation:landscape) and (max-height:480px){.hud{padding:6px 9px}.panel{padding:6px 9px}.bottom{padding:7px}.hint{max-width:44vw}.pad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(2,32px)}.pad button{font-size:15px}}
</style></head><body>
<canvas id="game" aria-label="Isometric magical town game prototype"></canvas>
<div class="hud"><div class="panel"><div class="title">Wizards of Ark</div><div class="small">Isometric field test · Moonveil Hamlet</div></div><div class="panel"><div class="title" id="area">Moonveil Square</div><div class="small" id="status">Explore the town</div></div><div class="tools"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="center" aria-label="Center camera">◎</button></div></div>
<div class="toast" id="toast"></div>
<div class="bottom"><div class="hint">Move with WASD / arrows or touch pad. Camera follows you; use +/− to zoom and ✦ INTERACT when near the rune.</div><div style="display:flex;flex-direction:column;align-items:end;gap:8px;pointer-events:auto"><button class="act pill" id="interact">✦ INTERACT</button><div class="pad" aria-label="Touch movement"><button class="up" data-dir="up" aria-label="Move up">▲</button><button class="left" data-dir="left" aria-label="Move left">◀</button><button class="down" data-dir="down" aria-label="Move down">▼</button><button class="right" data-dir="right" aria-label="Move right">▶</button></div></div></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),toast=document.querySelector('#toast'),status=document.querySelector('#status');let W=0,H=0,dpr=1,keys={},last=0,walk=0,interacted=false,zoom=1,cameraLock=true;const mapW=13,mapH=13,tw=64,th=32;let px=6.1,py=8.2;const blocked=new Set();for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){if((x<2&&y<5)||(x>9&&y<4)||(x<3&&y>9)||(x>10&&y>8))blocked.add(x+','+y)}const buildings=[{x:2.0,y:2.0,w:2.1,h:1.8,c:'#36244c',roof:'#7d3d94',name:'Moonveil Inn'},{x:8.4,y:1.8,w:2.1,h:2,c:'#202a4d',roof:'#5559a0',name:'Astral Archive'},{x:1.5,y:7.2,w:1.7,h:1.8,c:'#3b2445',roof:'#a24d7b',name:'Potion Shop'},{x:9.4,y:7.0,w:2.1,h:1.8,c:'#25203e',roof:'#6b4295',name:'Sigil Exchange'}];const rune={x:6.3,y:5.1};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);document.querySelector('#zoomIn').addEventListener('click',()=>{zoom=Math.min(1.8,zoom+.15);draw()});document.querySelector('#zoomOut').addEventListener('click',()=>{zoom=Math.max(.55,zoom-.15);draw()});document.querySelector('#center').addEventListener('click',()=>{cameraLock=true;draw();say('Camera centered on your wizard.')});document.querySelector('#interact').addEventListener('click',interact);function project(x,y){return{x:(x-y)*tw/2,y:(x+y)*th/2}}function screen(x,y){const p=project(x,y),cp=project(cameraLock?px:6.1,cameraLock?py:8.2);const scale=Math.max(.55,Math.min(1.8,Math.min(W/650,H/440,1.35)*zoom));return{x:W/2+(p.x-cp.x)*scale,y:H*.53+(p.y-cp.y)*scale+10*scale,scale}}function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function diamond(x,y,fill,stroke){poly([{x,y:y-th/2},{x:x+tw/2,y},{x,y:y+th/2},{x:x-tw/2,y}],fill,stroke)}function tile(x,y){const p=screen(x,y),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);const base=((x*17+y*31)%5);diamond(0,0,base<2?'#28253e':base<4?'#302741':'#27313b','#41334f');if((x*7+y*13)%9===0){ctx.fillStyle='#79628a';ctx.fillRect(-3,-2,5,2)}if((x*11+y*3)%13===0){ctx.fillStyle='#5eac92';ctx.fillRect(12,1,3,2)}ctx.restore()}function tree(x,y){const p=screen(x,y),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.fillStyle='#171727';ctx.fillRect(-3,-5,7,14);for(const a of [[0,-23,16,'#263d43'],[-10,-15,11,'#31554f'],[10,-14,12,'#3e465b'],[0,-35,10,'#4c3866']]){ctx.beginPath();ctx.arc(a[0],a[1],a[2],0,Math.PI*2);ctx.fillStyle=a[3];ctx.fill()}ctx.fillStyle='#bc75ff';ctx.globalAlpha=.7;ctx.fillRect(5,-29,2,2);ctx.restore()}function building(b){const p=screen(b.x,b.y),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);const w=b.w*tw*.47,h=b.h*th*.9;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,12,w*.8,17,0,0,7);ctx.fill();poly([{x:-w/2,y:-h/2},{x:0,y:-h/2-24},{x:w/2,y:-h/2},{x:0,y:-h/2+24}],b.roof,'#bd82d0');poly([{x:-w/2,y:-h/2},{x:0,y:-h/2+24},{x:0,y:h/2},{x:-w/2,y:h/2-24}],b.c);poly([{x:0,y:-h/2+24},{x:w/2,y:-h/2},{x:w/2,y:h/2-24},{x:0,y:h/2}], '#18172b');ctx.fillStyle='#f0c88b';ctx.fillRect(-w*.19,-3,11,17);ctx.fillStyle='#bd79ff';ctx.fillRect(w*.18,-h*.33,7,7);ctx.fillStyle='#e4c2ff';ctx.font='10px Georgia';ctx.textAlign='center';ctx.fillText(b.name,0,h/2+12);ctx.restore()}function drawRune(){const p=screen(rune.x,rune.y),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);const pulse=1+Math.sin(performance.now()/250)*.1;ctx.globalAlpha=.23;ctx.fillStyle='#b55dff';ctx.beginPath();ctx.ellipse(0,0,27*pulse,12*pulse,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#dca1ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(11,0);ctx.lineTo(0,16);ctx.lineTo(-11,0);ctx.closePath();ctx.stroke();ctx.strokeStyle='#8e54ff';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f5dcff';ctx.fillRect(-2,-2,4,4);ctx.restore()}function wizard(){const p=screen(px,py),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);const bob=Math.sin(walk/3)*1.5;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,8,12,5,0,0,7);ctx.fill();ctx.translate(0,bob);const step=Math.sin(walk)*2;ctx.fillStyle='#17142b';ctx.fillRect(-7,-1+step,5,10);ctx.fillRect(2,-1-step,5,10);ctx.fillStyle='#55306f';ctx.fillRect(-10,-15,20,17);ctx.fillStyle='#9c54cf';ctx.fillRect(-8,-14,16,3);ctx.fillStyle='#171222';ctx.fillRect(-8,-26,16,12);ctx.fillStyle='#e9c0a2';ctx.fillRect(-6,-25,12,9);ctx.fillStyle='#252039';ctx.fillRect(-7,-30,14,5);ctx.fillStyle='#6e43a0';ctx.beginPath();ctx.moveTo(-12,-29);ctx.lineTo(0,-48);ctx.lineTo(12,-29);ctx.closePath();ctx.fill();ctx.fillStyle='#c47dff';ctx.fillRect(-2,-39,4,3);ctx.fillStyle='#e5c98a';ctx.fillRect(10,-17,2,20);ctx.fillStyle='#b77aff';ctx.fillRect(8,-23,6,7);ctx.fillStyle='#f1d7ff';ctx.fillRect(10,-22,2,3);ctx.restore()}function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#100d22');bg.addColorStop(.6,'#17132a');bg.addColorStop(1,'#090914');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++)tile(x,y);for(const b of buildings)building(b);for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++)if((x*5+y*7)%11===0)tree(x,y);drawRune();wizard();ctx.fillStyle='#e8d8ff';ctx.font='12px Georgia';ctx.textAlign='center';const near=Math.hypot(px-rune.x,py-rune.y)<1.15;if(near){ctx.fillStyle='#f3caff';ctx.fillText('✦  INTERACT  ✦',W/2,H*.76)}}function say(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}function move(dt){let dx=0,dy=0;if(keys.ArrowUp||keys.w||keys.W)dy-=1;if(keys.ArrowDown||keys.s||keys.S)dy+=1;if(keys.ArrowLeft||keys.a||keys.A)dx-=1;if(keys.ArrowRight||keys.d||keys.D)dx+=1;if(dx||dy){const n=Math.hypot(dx,dy);dx/=n;dy/=n;const nx=Math.max(.5,Math.min(mapW-.5,px+dx*dt*2.7)),ny=Math.max(.5,Math.min(mapH-.5,py+dy*dt*2.7));if(!blocked.has(Math.floor(nx)+','+Math.floor(py)))px=nx;if(!blocked.has(Math.floor(px)+','+Math.floor(ny)))py=ny;walk+=dt*12;status.textContent='Exploring Moonveil Hamlet'}if(Math.hypot(px-rune.x,py-rune.y)<1.15&&keys[' '])interact()}function interact(){if(Math.hypot(px-rune.x,py-rune.y)<1.5){interacted=true;status.textContent='Ancient sigil awakened';say('The rune hums with old magic. Mathias: “You felt that too, didn’t you?”')}else say('Move closer to the glowing rune to interact.')}function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;move(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='e'||e.key==='E'||e.key==='Enter')interact();if(e.key==='+'||e.key==='=')zoom=Math.min(1.8,zoom+.15);if(e.key==='-')zoom=Math.max(.55,zoom-.15)});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-dir]').forEach(b=>{const k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});resize();requestAnimationFrame(loop)})();
</script></body></html>
