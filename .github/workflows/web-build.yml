name: Build WOA Arcane Realm Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate responsive playtest and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("playtest-2d/index.html").read_text(encoding="utf-8")
          required = {
              "viewport meta": 'name="viewport"' in html,
              "safe-area support": "env(safe-area-inset-bottom)" in html,
              "landscape layout": "orientation:landscape" in html,
              "portrait layout": "orientation:portrait" in html,
              "viewport resize handling": "visualViewport.addEventListener('resize',resize)" in html,
              "character creation": "Create Your Hero" in html,
              "Mathias encounter": "Mathias" in html,
              "2D canvas": 'id="game"' in html,
          }
          for label, passed in required.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          missing = [label for label, passed in required.items() if not passed]
          if missing:
              raise SystemExit("Missing responsive/game requirements: " + ", ".join(missing))
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline game script found")
          Path("/tmp/woa-playtest.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/woa-playtest.js

      - name: Build Railway web image
        run: docker build --tag woa-arcane-realm-web .

      - name: Smoke-test the 2D pixel-art game
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name woa-web-smoke -p 8080:8080 woa-arcane-realm-web
          trap 'docker rm --force woa-web-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ --output /tmp/woa-index.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/woa-index.html
          grep -q 'WOA · ARCANE REALM' /tmp/woa-index.html
          grep -q 'Create Your Hero' /tmp/woa-index.html
          grep -q 'heroName' /tmp/woa-index.html
          grep -q 'Begin Your Adventure' /tmp/woa-index.html
          grep -q 'Mathias' /tmp/woa-index.html
          grep -q 'getContext.*2d' /tmp/woa-index.html
          grep -q 'orientation:landscape' /tmp/woa-index.html
          grep -q 'orientation:portrait' /tmp/woa-index.html
          grep -q 'visualViewport.addEventListener' /tmp/woa-index.html

          echo "2D pixel-art game served successfully: character creation, name entry, Mathias encounter, touch controls, responsive portrait/landscape layouts, and valid JavaScript are present."
