name: Build WOA Arcane Realm Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Export Windows PC build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project assets
        shell: pwsh
        run: godot --headless --editor --path . --quit

      - name: Export Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          godot --headless --path . --export-release "Windows Desktop" build/windows/WOA-Arcane-Realm.exe
          if (!(Test-Path "build/windows/WOA-Arcane-Realm.exe")) {
            throw "Godot did not create build/windows/WOA-Arcane-Realm.exe"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WOA-Arcane-Realm-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/WOA-Arcane-Realm.apk
          test -s build/android/WOA-Arcane-Realm.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WOA-Arcane-Realm-Android-APK
          path: build/android/WOA-Arcane-Realm.apk
          if-no-files-found: error
          retention-days: 14
