name: Arcane Realm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: node --check scripts/new-asset.mjs
      - run: npm run assets:new -- --id qa.pipeline-check --category vfx --name "CI Pipeline Check" --dry-run
      - run: npm run assets:validate
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - run: npm run test:browser
      - run: npm run build
